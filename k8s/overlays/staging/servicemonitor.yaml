apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskly-api
  namespace: taskly-staging
  labels:
    release: taskly-monitoring
spec:
  namespaceSelector:
    matchNames:
      - taskly-staging
  selector:
    matchLabels:
      app: taskly-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
